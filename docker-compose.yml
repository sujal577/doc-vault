services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docvault
      POSTGRES_PASSWORD: docvault
      POSTGRES_DB: docvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docvault -d docvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://docvault:docvault@postgres:5432/docvault
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-min32}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      STORAGE_PATH: /data/uploads
      CORS_ORIGIN: http://localhost:3000
      API_PORT: 4000
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
